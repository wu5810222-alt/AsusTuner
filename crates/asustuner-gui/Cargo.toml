[package]
name = "asustuner-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AsusTuner KDE/QML 前端（cxx-qt，直连 asusd + ryzenadj）"

[[bin]]
name = "asustuner-gui"
path = "src/main.rs"

[build-dependencies]
cxx-qt-build = "0.10"
cxx = "1.0.176"

[dependencies]
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
cxx = "1.0.176"
zbus = { version = "4", features = ["blocking"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
zvariant = "4"
serde_json = "1"
